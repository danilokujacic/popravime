# Production stack for the deploy VPS: the Nest API (built from this repo's own multi-stage
# Dockerfile) plus the self-hosted Redis/Loki/Grafana services the app depends on at runtime.
#
# No nginx service here — the host already has its own nginx installed, running outside Docker.
# `api` publishes port 3000 on loopback (127.0.0.1:3000) for that host nginx to reverse-proxy to;
# see nginx/nginx.conf for the config to install into the host's nginx (not consumed by Docker).
#
# Deliberately NOT here: postgres/minio/maildev — production uses managed Neon Postgres,
# Cloudflare R2, and a real SMTP relay (Brevo) instead of local stand-ins for those. See
# docker-compose.yml for the local-dev counterpart of this file.
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# `.env` next to this file must hold the REAL production values — DATABASE_HOST=<Neon host>,
# DATABASE_SSL=true, STORAGE_ENDPOINT=<R2 endpoint>, EMAIL_HOST=<Brevo relay>,
# CORS_ORIGIN=<real allow-list>, NODE_ENV=production, REDIS_PASSWORD, GRAFANA_ADMIN_PASSWORD,
# ALERT_EMAIL_TO (where Grafana sends resource/error alerts) ... — never the dev `.env` this repo
# runs against locally. NODE_ENV=production with an empty/"*" CORS_ORIGIN fails fast at boot
# instead of silently allowing every origin (src/config/env.validation.ts) — set a real one
# before the first deploy.
#
# node-exporter/cadvisor/prometheus below are the resource-monitoring stack: node-exporter +
# cadvisor expose host/container metrics, prometheus scrapes and stores them, and Grafana's
# Prometheus datasource + grafana/provisioning/alerting/ read from it. Loki/Grafana already
# existed for logs; this is the CPU/memory/disk half, plus the email alert rules on top of both.
#
# Before first deploy: point the host nginx at 127.0.0.1:3000 (see nginx/nginx.conf), issue a
# TLS cert for the real domain (DEPLOY.md §5), and install the Loki Docker logging driver once
# on the host (DEPLOY.md §4a) — `docker plugin install grafana/loki-docker-driver:latest --alias
# loki --grant-all-permissions` — before this file's `api.logging` block below can attach to it.

# Explicit project name so this never collides with docker-compose.yml's (dev) networks/volumes
# if the two are ever run on the same host (they otherwise both default to the directory name).
name: popravime-prod

services:
  # Production-safe by default: takes every app value straight from `env_file`, only REDIS_HOST/
  # PORT are pinned here (containers never have a host port-conflict reason to override PORT).
  # Published on loopback only (127.0.0.1:3000) — the host's own nginx (outside Docker) reverse-
  # proxies to it from there; nothing but that host nginx should ever reach this port.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:3000:3000' ]
    depends_on:
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_HOST: redis
      PORT: '3000'
    healthcheck:
      test: [ 'CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Ships logs to the self-hosted `loki` container via Docker's own Loki logging driver
    # rather than a sidecar or an in-process transport — see
    # openspec/changes/add-grafana-loki-observability/design.md decision 2. `loki-url` targets
    # the HOST's loopback (the logging driver runs at the Docker-daemon level, outside this
    # container's own network namespace, so it reaches Loki via the published host port, not
    # the `internal` Docker network `loki:3100` other containers use). `mode: non-blocking`
    # matters: without it, a slow/unreachable Loki can stall the api container's log writes —
    # worst case, the app itself. Under this mode, Loki being down just drops log lines.
    #
    # Once this is active, `docker compose logs api` stops returning anything (Docker only
    # supports one logging driver per container) — use a Loki query instead (DEPLOY.md §11).
    logging:
      driver: loki
      options:
        loki-url: 'http://127.0.0.1:4201/loki/api/v1/push'
        loki-external-labels: 'job=popravime-api,env=production'
        mode: non-blocking
        max-buffer-size: 4m

  redis:
    image: redis:7-alpine
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' ]
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:6379:6379' ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted log storage — see the `api` service's `logging` block above for how logs reach
  # it. Bound to loopback only (127.0.0.1:4201); never exposed publicly.
  loki:
    image: grafana/loki:2.9.8
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:4201:3100' ]
    command: [ '-config.file=/etc/loki/loki-config.yaml' ]
    volumes:
      - lokidata:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:3100/ready || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Self-hosted log visualization, pre-provisioned with the Loki + Prometheus datasources, the
  # "Email pipeline" dashboard, and email-alerting rules (see grafana/provisioning/alerting/).
  # Bound to the loopback interface only — reach it over an SSH tunnel
  # (`ssh -L 4200:127.0.0.1:4200 you@host`, then http://localhost:4200), never opened on the
  # firewall (see design.md decision 1, DEPLOY.md §2).
  grafana:
    image: grafana/grafana:10.4.2
    networks: [ internal ]
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports: [ '127.0.0.1:4200:3000' ]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Same SMTP relay (Brevo) the app itself sends transactional email through — reused here
      # so alert emails don't need a second set of credentials. ALERT_EMAIL_TO is only consumed
      # by grafana/provisioning/alerting/contact-points.yaml, not by the Nest app.
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: '${EMAIL_HOST}:${EMAIL_PORT}'
      GF_SMTP_USER: ${EMAIL_USER}
      GF_SMTP_PASSWORD: ${EMAIL_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${EMAIL_FROM}
      GF_SMTP_FROM_NAME: 'Popravime Monitoring'
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:3000/api/health || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Host + per-container resource metrics (CPU/memory/disk/network) — scraped by `prometheus`
  # below and visualized/alerted on in Grafana. Loopback-only, same as everything else here.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks: [ internal ]
    restart: unless-stopped
    pid: host
    ports: [ '127.0.0.1:9100:9100' ]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # Per-container resource metrics. Needs `privileged: true` to read full cgroup/container data
  # on an arbitrary host — a real (if standard/well-known) increase in this container's blast
  # radius if it were ever compromised; accepted here since it's loopback-only and unauthenticated
  # from outside the VM either way. Drop this service if that trade-off isn't acceptable — nothing
  # else depends on it besides the `cadvisor` Prometheus scrape target and its Grafana panels.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks: [ internal ]
    restart: unless-stopped
    privileged: true
    ports: [ '127.0.0.1:8080:8080' ]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # Scrapes node-exporter + cadvisor and stores the time series Grafana's Prometheus datasource
  # (and the resource-alert rules in grafana/provisioning/alerting/) read from.
  prometheus:
    image: prom/prometheus:v2.53.0
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:9090:9090' ]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:9090/-/healthy || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  # api <-> redis/loki (admin-only services never published beyond loopback). The host's own
  # nginx isn't a Docker container, so there's no need for a separate edge/internal split
  # anymore — everything here talks to everything else on one network.
  internal:
    driver: bridge

volumes:
  redisdata:
  lokidata:
  grafanadata:
  promdata:
