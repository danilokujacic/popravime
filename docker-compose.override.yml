# Auto-loaded by `docker compose up` alongside docker-compose.yml. Only meant for running the
# full stack in containers locally (`docker compose up --build`, per README "Getting started").
# Do NOT deploy this file to production — it points the api container at the local
# postgres/minio/maildev containers instead of Neon/R2/a real SMTP relay.
services:
  api:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      maildev:
        condition: service_started
    environment:
      DATABASE_HOST: postgres
      STORAGE_ENDPOINT: http://minio:9000
      EMAIL_HOST: maildev
