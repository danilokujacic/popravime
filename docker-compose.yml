services:
  postgres:
    # Local development only. Production uses a managed cloud Postgres instance,
    # never this container.
    profiles: [ local ]
    image: postgres:16-alpine
    networks: [ internal ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports: [ '127.0.0.1:5432:5432' ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}' ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' ]
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:6379:6379' ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Local development stand-in for Cloudflare R2 (both S3-compatible).
    profiles: [ local ]
    image: minio/minio
    command: server /data --console-address ":9001"
    networks: [ internal ]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ 'CMD', 'mc', 'ready', 'local' ]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    # Local development stand-in for the production SMTP relay.
    profiles: [ local ]
    image: maildev/maildev
    networks: [ internal ]
    restart: unless-stopped
    ports:
      - '127.0.0.1:1080:1080'
      - '127.0.0.1:1025:1025'

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
