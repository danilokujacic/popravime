services:
  postgres:
    # Local development only. Production uses a managed cloud Postgres instance,
    # never this container.
    profiles: [ local ]
    image: postgres:16-alpine
    networks: [ internal ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports: [ '127.0.0.1:5432:5432' ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}' ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' ]
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:6379:6379' ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Local development stand-in for Cloudflare R2 (both S3-compatible).
    profiles: [ local ]
    image: minio/minio
    command: server /data --console-address ":9001"
    networks: [ internal ]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ 'CMD', 'mc', 'ready', 'local' ]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    # Local development stand-in for the production SMTP relay.
    profiles: [ local ]
    image: maildev/maildev
    networks: [ internal ]
    restart: unless-stopped
    ports:
      - '127.0.0.1:1080:1080'
      - '127.0.0.1:1025:1025'

  # Self-hosted log storage. Runs in both dev and prod (unlike postgres/minio/maildev above,
  # this isn't a stand-in for a managed service — it's the real thing). The `api` service ships
  # its logs here via the Docker Loki logging driver once that service exists again (see
  # DEPLOY.md and openspec/changes/add-grafana-loki-observability/ — docker-compose.yml
  # currently has no `api`/`nginx` service to attach that driver to; a prior commit dropped
  # them, tracked separately from this change).
  loki:
    image: grafana/loki:2.9.8
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:4201:3100' ]
    command: [ '-config.file=/etc/loki/loki-config.yaml' ]
    volumes:
      - lokidata:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:3100/ready || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Self-hosted log visualization, pre-provisioned with the Loki datasource and a starter
  # dashboard. Bound to the loopback interface only — reach it over an SSH tunnel, same as any
  # other admin-only tool on the deploy host (see design.md decision 1).
  grafana:
    image: grafana/grafana:10.4.2
    networks: [ internal ]
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    ports: [ '127.0.0.1:4200:3000' ]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -q --spider http://localhost:3000/api/health || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  lokidata:
  grafanadata:
