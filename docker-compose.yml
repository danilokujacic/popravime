# Local development infra only — everything the API needs to run *on the host* via
# `pnpm start:dev` (README "Getting started"): Postgres, Redis, MinIO (an S3-compatible stand-in
# for Cloudflare R2), and Maildev (a local SMTP catcher standing in for Brevo). No `api`/`nginx`/
# `loki`/`grafana` here — those are production-only, see `docker-compose.prod.yml`.
#
# Usage:
#   docker compose up -d
#
# No `profiles:` gating on any service — unlike the old single shared compose file, this one is
# dev-only by definition, so a bare `docker compose up` just starts everything in it.

# Explicit project name so this never collides with `docker-compose.prod.yml`'s networks/volumes
# if the two are ever run on the same host (they otherwise both default to the directory name).
name: popravime-dev

services:
  postgres:
    image: postgres:16-alpine
    networks: [ internal ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports: [ '127.0.0.1:5432:5432' ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}' ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Not in the prod-only list you gave me, but included anyway: the app can't boot without a
  # reachable Redis (BullMQ's queue module is wired in unconditionally, see
  # src/modules/infra/queue/queue.module.ts) — local dev needs one too, same as it always has via
  # the old file's `docker compose up -d postgres redis minio maildev`. Delete this block if
  # you'd rather point local dev at the VPS's Redis instead.
  redis:
    image: redis:7-alpine
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' ]
    networks: [ internal ]
    restart: unless-stopped
    ports: [ '127.0.0.1:6379:6379' ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Local development stand-in for Cloudflare R2 (both S3-compatible).
    image: minio/minio
    command: server /data --console-address ":9001"
    networks: [ internal ]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ 'CMD', 'mc', 'ready', 'local' ]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    # Local development stand-in for the production SMTP relay (Brevo).
    image: maildev/maildev
    networks: [ internal ]
    restart: unless-stopped
    ports:
      - '127.0.0.1:1080:1080'
      - '127.0.0.1:1025:1025'

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
