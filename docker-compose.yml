services:
  # Production-safe by default: only depends on redis (which production also runs locally on
  # the host per the deploy runbook) and takes every other value straight from env_file, so a
  # production `.env` pointing DATABASE_HOST/STORAGE_ENDPOINT/EMAIL_HOST at Neon/R2/a real SMTP
  # relay is never silently overridden. docker-compose.override.yml adds the local
  # postgres/minio/maildev wiring on top of this for `docker compose up --build` in dev.
  # PORT is pinned to 3000 (matching the Dockerfile and nginx's upstream) regardless of what a
  # host-run `pnpm start:dev` uses in .env — containers never have a host port-conflict reason
  # to change it.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [ edge, internal ]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_HOST: redis
      PORT: '3000'
    healthcheck:
      test: [ 'CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    # Local development only. Production uses a managed cloud Postgres instance,
    # never this container.
    image: postgres:16-alpine
    networks: [ internal ]
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports: [ '5432:5432' ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}' ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD}' ]
    networks: [ internal ]
    ports: [ '6379:6379' ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Local development stand-in for Cloudflare R2 (both S3-compatible).
    image: minio/minio
    command: server /data --console-address ":9001"
    networks: [ internal ]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ 'CMD', 'mc', 'ready', 'local' ]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    # Local development stand-in for the production SMTP relay.
    image: maildev/maildev
    networks: [ internal ]
    ports:
      - '1080:1080'
      - '1025:1025'
  nginx:
    image: nginx:alpine
    networks: [ edge ]
    restart: unless-stopped
    depends_on: [ api ]
    ports: [ '80:80', '443:443' ]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates issued on the host (e.g. certbot in webroot mode), mounted read-only.
      # See DEPLOY.md for how these are obtained/renewed.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot's HTTP-01 webroot: a bind mount (not a named volume) so the host's own certbot
      # process and this container see the same challenge files. See DEPLOY.md.
      - ./certbot-webroot:/var/www/certbot

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
