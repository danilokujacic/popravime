  #     DATABASE_HOST: postgres
  #     REDIS_HOST: redis
  #     STORAGE_ENDPOINT: http://minio:9000
  #     EMAIL_HOST: maildev

  postgres:
    # Local development only. Production uses a managed cloud Postgres instance,
    # never this container.
    image: postgres:16-alpine
    networks: [ internal ]
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports: [ '5432:5432' ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}' ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD}' ]
    networks: [ internal ]
    ports: [ '6379:6379' ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Local development stand-in for Cloudflare R2 (both S3-compatible).
    image: minio/minio
    command: server /data --console-address ":9001"
    networks: [ internal ]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ 'CMD', 'mc', 'ready', 'local' ]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    # Local development stand-in for the production SMTP relay.
    image: maildev/maildev
    networks: [ internal ]
    ports:
      - '1080:1080'
      - '1025:1025'
  # nginx:
  #   image: nginx:alpine
  #   networks: [ edge ]
  #   depends_on: [ api ]
  #   ports: [ '80:80' ]
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
