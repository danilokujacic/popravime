# Install this into the host's own nginx (e.g. /etc/nginx/sites-available/popravime, symlinked
# into sites-enabled) — nginx runs directly on the VPS here, not as a Docker container, so this
# file is a reference config, not something docker-compose.prod.yml mounts. Adjust the
# acme-challenge root below to match wherever your existing certbot setup already expects it, if
# different from /var/www/certbot.
#
# Replace YOUR_DOMAIN with the real production domain before first deploy (see DEPLOY.md) —
# it must match the domain the TLS certificate under /etc/letsencrypt/live/ was issued for.

server_tokens off;

upstream api_upstream {
    # docker-compose.prod.yml publishes the api container on loopback:3000 — this is the host
    # nginx process reaching across into Docker via that published port, not a Docker network
    # hostname (there's no Docker DNS for a container name reachable from the host itself).
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let certbot's HTTP-01 challenge complete over plain HTTP during issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;
    gzip on;
    gzip_types application/json text/plain;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
